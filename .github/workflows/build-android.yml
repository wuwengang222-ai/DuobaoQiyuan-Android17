name: Build Duobao double feature and Android emulator smoke
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM for Android Emulator on Linux
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm || (echo 'KVM unavailable: Android emulator test cannot run' >&2; exit 1)
      - name: Check the two original MRP assets were supplied lawfully
        run: python3 scripts/verify_game_assets.py
      - name: Test offline state machine and emulator bridge mocks
        run: bash scripts/run_tests.sh
      - name: Preflight CI network, Android SDK and emulator host
        run: python3 scripts/preflight_environment.py --output build/diagnostics/preflight.json
      - name: Fetch emulator engine and baseline files
        run: python3 scripts/prepare_runtime.py
      - name: Validate real WebAssembly and complete offline asset tree
        run: |
          node scripts/verify_runtime_assets.js
          node --check app/src/main/assets/vmrp.js
      - name: Android SDK platform
        run: |
          # Stable build SDK; Android 17 is validated separately by the emulator.
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          echo "SDK command-line tools: $(sdkmanager --version)"
      - name: Compile and static-check APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: API 37 emulator launch and manual two-chapter smoke test (NOT a playthrough)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 17 system images have minor-version package IDs.
          # "37" can pick a missing system-images;android-37 target on CI.
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            python3 -m pip install Pillow
            bash scripts/ci_emulator_smoke.sh
      - name: Archive environment and runtime diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-environment-evidence
          path: build/diagnostics/
      - name: Archive logcat/screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-17-emulator-evidence
          path: build/smoke/
      - name: Archive untested APK
        uses: actions/upload-artifact@v4
        with:
          name: DuobaoDuology_debug_APK_requires_real_playthrough_validation
          path: app/build/outputs/apk/debug/*.apk
