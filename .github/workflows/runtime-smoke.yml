name: VMRP engine + Android 17 smoke (upstream fixture, NOT Duobao games)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runtime-smoke.yml'
      - 'scripts/prepare_runtime.py'
      - 'app/**'
      - 'scripts/ci_fixture_smoke.sh'
      - 'scripts/adb_assert_featurephone_ui.py'
      - 'scripts/ci_install_and_launch.sh'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.runner_os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - emulator_api: '36'
            image_target: google_apis
            runner_os: ubuntu-24.04
          - emulator_api: '37.0'
            image_target: google_apis_ps16k
            runner_os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate feature-phone UI event mapping (source-only)
        shell: bash
        run: |
          node --check app/src/main/assets/duobao_phone_ui.js
          node tests/test_phone_layout.js
          grep -Fq 'applyImmersiveMode()' app/src/main/java/com/duobao/duology/MainActivity.java
      - name: Use an upstream VMRP fixture, NOT either Duobao game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/games
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/vmrp/vmrp/master/wasm/dist/fs/mythroad/dsm_gm.mrp \
            --output app/src/main/assets/games/part1.mrp
          test -s app/src/main/assets/games/part1.mrp
          cp app/src/main/assets/games/part1.mrp app/src/main/assets/games/part2.mrp
          echo 'Upstream fixture only; this is NOT a test of either Duobao storyline.'
      - name: Download real VMRP wasm/js and platform files
        run: python3 scripts/prepare_runtime.py
      - name: Validate actual WebAssembly and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/vmrp.js
          node - <<'NODE'
          const fs = require('node:fs');
          const bytes = fs.readFileSync('app/src/main/assets/vmrp.wasm');
          if (bytes.length < 10000 || !WebAssembly.validate(bytes)) {
            throw Error('Downloaded VMRP wasm was not valid');
          }
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          if (!html.includes('duobao_bridge.js') || html.includes('src="./fs.js"')) {
            throw Error('VMRP HTML loader did not include project bridge');
          }
          console.log('Real VMRP WASM validated:', bytes.length, 'bytes');
          NODE
      - name: Install API 37 build tools and compile debug APK (fixture ONLY)
        shell: bash
        run: |
          set -euo pipefail
          # Stable build SDK; Android 17 is validated separately by the emulator.
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          gradle :app:assembleDebug --stacktrace --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'Android APK compiled with UPSTREAM FIXTURE (not the actual two games).'
      - name: Verify APK installability (4-byte resources / 16-KiB JNI / v2 signing)
        run: |
          python3 scripts/check_apk_install.py app/build/outputs/apk/debug/app-debug.apk
          zipalign -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Package upstream-fixture runtime APK for physical Android compatibility testing
        uses: actions/upload-artifact@v4
        with:
          name: VMRP_upstream_fixture_debug_APK_API${{ matrix.emulator_api }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Enable KVM for Android 17 emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - name: Start and validate ADB server before emulator startup
        shell: bash
        run: |
          adb start-server
          adb devices -l
          test -c /dev/kvm
      - name: API matrix emulator boot and WebAssembly runtime check (fixture ONLY)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.emulator_api }}
          emulator-boot-timeout: 720
          cores: 2
          ram-size: 6144M
          disk-size: 8192M
          target: ${{ matrix.image_target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader -noaudio -no-boot-anim -no-metrics -camera-back none
          script: EXPECTED_API='${{ matrix.emulator_api }}' bash scripts/ci_fixture_smoke.sh
      - name: Print emulator diagnosis on failed boots
        if: failure()
        shell: bash
        run: |
          echo 'Emulator boot failed (fixture only): diagnostic host summary'
          adb devices -l || true
          free -h || true
          df -h / || true
          ls -l /dev/kvm || true
          find ~/.android/avd -maxdepth 2 -name '*.ini' -type f -print || true
      - name: Cleanup temporary runtime and demo game binaries
        if: always()
        shell: bash
        run: |
          rm -rf app/src/main/assets/games
          rm -f app/src/main/assets/vmrp.wasm app/src/main/assets/vmrp.js
          rm -rf app/build
